[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-qwen-distillation"
version = "0.1.0"
description = "Reproducible Fable coding-agent distillation pipeline for Qwen3-8B Base"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Fable Qwen Distillation contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = [
  "datasets==3.5.0",
  "huggingface-hub==0.30.2",
  "orjson==3.10.16",
  "datasketch==1.6.5",
  "rapidfuzz==3.13.0",
  "scikit-learn==1.6.1",
]
train = [
  "torch==2.6.0",
  "transformers==4.51.3",
  "accelerate==1.6.0",
  "peft==0.15.2",
  "bitsandbytes==0.45.5",
  "trl==0.17.0",
  "safetensors==0.5.3",
]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
