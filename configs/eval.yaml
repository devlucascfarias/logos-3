model:
  base: Qwen/Qwen3-8B
  adapters:
    - outputs/adapters/stage1
    - outputs/adapters/stage2
data:
  static_file: data/processed/test.jsonl
  agent_tasks: data/processed/agent_tasks.jsonl
generation:
  max_new_tokens: 512
  seed: 42
  repetition_penalty: 1.05
  profiles:
    thinking:
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    non_thinking:
      do_sample: true
      temperature: 0.7
      top_p: 0.8
      top_k: 20
harness:
  max_steps: 20
  command_timeout_seconds: 30
  max_output_bytes: 12000
  allow_network: false
output_dir: outputs/evaluations
