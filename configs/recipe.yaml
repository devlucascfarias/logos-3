seed: 42
model_name: Qwen/Qwen3-8B
model_revision: b968826d9c46dd6066d109eabc6255188de91218
system_prompt: >-
  Você é um assistente especializado em programação. Analise a evidência,
  produza código correto, use ferramentas quando necessário e valide a solução.

data:
  max_seq_length: 4096
  candidate_oversample: 2.5
  shuffle_buffer: 10000
  validation_fraction: 0.02
  validation_min_examples: 32
  max_category_deviation: 0.05
  max_reasoning_deviation: 0.05
  min_token_budget_fraction: 0.95
  max_examples_per_group: 2
  max_tool_output_chars: 12000
  max_tool_messages: 48
  max_repeated_message_run: 2
  repeated_line_min_chars: 12
  max_repeated_line_occurrences: 3
  repeated_ngram_size: 8
  max_repeated_ngram_occurrences: 6
  reject_unclosed_blocks: true
  max_assistant_chars: 20000
  min_tokens: 32
  holdout_ids_file: data/eval_holdout_ids.txt
  blocked_benchmark_markers:
    - humaneval
    - mbpp
    - livecodebench
  reasoning_distribution:
    # O corpus disponível contém poucos <think> curtos. Priorizamos respostas
    # diretas e limitamos raciocínios longos sem criar/truncar CoT artificial.
    short: 0.03
    medium: 0.22
    long: 0.30
    direct: 0.45
  # Converte deterministicamente parte do CoT verificado em respostas diretas,
  # preservando a resposta final em vez de truncar raciocínio.
  direct_conversion_fraction_by_category:
    verified_code: 0.45

stages:
  corrective_v1:
    token_budget: 320000
    category_weights:
      corrective_contracts: 0.50
      corrective_opencode: 0.35
      corrective_replay: 0.15
    data:
      max_seq_length: 2048
      candidate_oversample: 1.25
      max_examples_per_group: 0
      reasoning_distribution:
        direct: 1.0
    training:
      requires_adapter: true
      verify_source_data: false
      # Fornecido pelo notebook/CLI; aponta para o piloto campeão preservado.
      adapter_path: null
      output_dir: outputs/checkpoints/corrective_v1
      adapter_output_dir: outputs/adapters/corrective_v1
      evaluation_output_dir: outputs/evaluations/corrective_v1
      learning_rate: 0.00001
      num_train_epochs: 1
      max_seq_length: 2048
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      logging_steps: 1
      save_steps: 2
      eval_steps: 2
      save_total_limit: 12
      min_optimizer_steps: 15
      max_optimizer_steps: 25
  pilot:
    token_budget: 500000
    category_weights:
      verified_code: 0.60
      reasoning: 0.20
      swe: 0.10
      claude_code: 0.05
      general_tools: 0.05
    training:
      output_dir: outputs/checkpoints/pilot
      adapter_output_dir: outputs/adapters/pilot
      learning_rate: 0.00005
      num_train_epochs: 1
      max_seq_length: 4096
      logging_steps: 1
      save_steps: 1
      eval_steps: 1
      save_total_limit: 20
  pilot_continuation:
    token_budget: 500000
    category_weights:
      verified_code: 0.60
      reasoning: 0.20
      swe: 0.10
      claude_code: 0.05
      general_tools: 0.05
    training:
      # Reutiliza exatamente o conjunto aprovado no piloto; não refaz o mix.
      data_stage: pilot
      requires_adapter: true
      verify_source_data: true
      # Fornecido pelo notebook/CLI para não gravar um caminho pessoal no repo.
      adapter_path: null
      output_dir: outputs/checkpoints/pilot_continuation
      adapter_output_dir: outputs/adapters/pilot_continuation
      learning_rate: 0.00002
      num_train_epochs: 1
      max_seq_length: 4096
      logging_steps: 1
      save_steps: 1
      eval_steps: 1
      save_total_limit: 20
  baseline:
    token_budget: 15000000
    category_weights:
      verified_code: 0.60
      reasoning: 0.20
      swe: 0.10
      claude_code: 0.05
      general_tools: 0.05
    training:
      output_dir: outputs/checkpoints/baseline
      adapter_output_dir: outputs/adapters/baseline
      learning_rate: 0.0001
      num_train_epochs: 1
      max_seq_length: 4096
  main:
    token_budget: 50000000
    category_weights:
      verified_code: 0.45
      reasoning: 0.20
      swe: 0.20
      claude_code: 0.10
      general_tools: 0.05
    training:
      output_dir: outputs/checkpoints/main
      adapter_output_dir: outputs/adapters/main
      learning_rate: 0.0001
      num_train_epochs: 1
      max_seq_length: 4096
  agentic:
    token_budget: 10000000
    category_weights:
      swe: 1.00
    successful_trajectories_only: true
    training:
      output_dir: outputs/checkpoints/agentic
      adapter_output_dir: outputs/adapters/agentic
      # Preencha com o adapter escolhido por scripts/select_checkpoint.py.
      adapter_path: null
      learning_rate: 0.00003
      num_train_epochs: 1
      max_seq_length: 4096

training_defaults:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  attn_implementation: sdpa
  packing: true
  # "wrapped" mantém o packing sem exigir FlashAttention/padding-free.
  packing_strategy: wrapped
  assistant_only_loss: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  use_reentrant: false
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  bf16: true
  tf32: true
  logging_steps: 5
  save_steps: 250
  eval_steps: 250
  save_total_limit: 3
  report_to: tensorboard

