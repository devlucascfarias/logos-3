    category: verified_code
    source_weight: 0.65
    license: cc-by-4.0
    curated: true
  - name: nvidia/Nemotron-Competitive-Programming-v1
    split: competitive_coding_python_part00
    category: verified_code
    source_weight: 0.175
    license: cc-by-4.0
    curated: true
  - name: nvidia/Nemotron-Competitive-Programming-v1
    split: competitive_coding_python_part01
    category: verified_code
    source_weight: 0.175
    license: cc-by-4.0
    curated: true
  - name: open-thoughts/OpenThoughts-114k
    split: train
    category: reasoning
    source_weight: 1.0
    license: apache-2.0
    curated: true
  - name: nvidia/Nemotron-SFT-SWE-v2
    split: openhands_swe
    # O schema publicado omite colunas presentes no JSONL e quebra o streaming
    # do datasets==5.0.0. Leia o arquivo bruto até a fonte corrigir o metadata.
    raw_jsonl_file: data/swe.jsonl
    shuffle_buffer: 256
    category: swe
    source_weight: 1.0
    license: cc-by-4.0
    curated: true
  - name: nlile/misc-merged-claude-code-traces-v1
